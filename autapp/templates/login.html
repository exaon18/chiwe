<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Network Login - Boilerplate</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .pi-button {
            background: linear-gradient(135deg, #ffc107, #ff8f00);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .pi-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 193, 7, 0.3);
        }

        .pi-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .pi-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .pi-button.loading {
            color: transparent;
        }

        .pi-button.loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pi-icon {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffc107;
            font-size: 0.9rem;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .debug-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #495057;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-info h3 {
            margin-bottom: 10px;
            color: #333;
            font-family: inherit;
        }

        .user-info {
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e8;
            border-radius: 10px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .user-info h3 {
            color: #155724;
            margin-bottom: 15px;
        }

        .user-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px solid #c3e6cb;
        }

        .user-detail:last-child {
            border-bottom: none;
        }

        .redirect-info {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            color: #856404;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">π</div>
        <h1>Pi Network Login</h1>
        <p class="subtitle">Secure authentication with Pi Network</p>
        
        <button id="piLoginBtn" class="pi-button">
            <div class="pi-icon">π</div>
            <span>Login with Pi Network</span>
        </button>
        
        <div id="status" class="status"></div>
        
        <div id="userInfo" class="user-info">
            <h3>User Information</h3>
            <div id="userDetails"></div>
        </div>
        
        <div id="redirectInfo" class="redirect-info">
            <strong>Success!</strong> Redirecting to dashboard in <span id="countdown">3</span> seconds...
        </div>
        
        <div class="debug-info">
            <h3>Debug Log</h3>
            <div id="debugLog"></div>
        </div>
    </div>

    <script>
        // Pi Network Login Boilerplate
        // This is a complete, functional implementation following Pi Network documentation
        
        class PiNetworkAuth {
            constructor() {
                this.isInitialized = false;
                this.isLoading = false;
                this.user = null;
                this.debugLog = [];
                
                // DOM elements
                this.loginBtn = document.getElementById('piLoginBtn');
                this.status = document.getElementById('status');
                this.userInfo = document.getElementById('userInfo');
                this.userDetails = document.getElementById('userDetails');
                this.redirectInfo = document.getElementById('redirectInfo');
                this.debugLogElement = document.getElementById('debugLog');
                this.countdown = document.getElementById('countdown');
                
                this.init();
            }
            
            // Initialize Pi SDK
            async init() {
                try {
                    this.log('Initializing Pi SDK...');
                    
                    // Initialize Pi SDK in sandbox mode
                    await Pi.init({ 
                        version: "2.0", 
                        sandbox: true // Always use sandbox for development/testing
                    });
                    
                    this.isInitialized = true;
                    this.log('Pi SDK initialized successfully in sandbox mode');
                    this.showStatus('Pi SDK ready for authentication', 'info');
                    
                    // Check if user is already authenticated
                    try {
                        this.user = await Pi.User.get();
                        this.log('User already authenticated:', this.user);
                        this.displayUserInfo(this.user);
                    } catch (error) {
                        this.log('No existing authentication found');
                    }
                    
                } catch (error) {
                    this.log('Failed to initialize Pi SDK:', error.message);
                    this.showStatus('Failed to initialize Pi Network SDK', 'error');
                    this.loginBtn.disabled = true;
                }
                
                // Attach event listener
                this.loginBtn.addEventListener('click', () => this.authenticate());
            }
            
            // Handle incomplete payments (required by Pi Network)
            onIncompletePaymentFound(payment) {
                this.log('Incomplete payment found:', payment);
                // Handle incomplete payment according to Pi Network documentation
                return Pi.completePayment(payment.identifier);
            }
            
            // Main authentication method
            async authenticate() {
                if (this.isLoading) {
                    this.log('Authentication already in progress');
                    return;
                }
                
                if (!this.isInitialized) {
                    this.showStatus('Pi SDK not initialized', 'error');
                    return;
                }
                
                try {
                    this.isLoading = true;
                    this.setLoadingState(true);
                    this.log('Starting Pi Network authentication...');
                    
                    // Define required scopes according to Pi Network documentation
                    const scopes = ['username', 'payments'];
                    this.log('Requesting scopes:', scopes);
                    
                    // Authenticate with Pi Network
                    const authResult = await Pi.authenticate(scopes, this.onIncompletePaymentFound.bind(this));
                    
                    this.log('Authentication successful:', {
                        hasAccessToken: !!authResult?.accessToken,
                        hasUser: !!authResult?.user,
                        username: authResult?.user?.username,
                        uid: authResult?.user?.uid
                    });
                    
                    // Validate authentication result
                    if (!authResult || !authResult.accessToken || !authResult.user) {
                        throw new Error('Invalid authentication result from Pi Network');
                    }
                    
                    // Store user data
                    this.user = authResult.user;
                    
                    // Display success
                    this.showStatus(`Welcome ${authResult.user.username}! Authentication successful.`, 'success');
                    this.displayUserInfo(authResult.user, authResult.accessToken);
                    
                    // Store authentication data (you can send this to your backend)
                    const authData = {
                        accessToken: authResult.accessToken,
                        user: {
                            uid: authResult.user.uid,
                            username: authResult.user.username
                        },
                        timestamp: new Date().toISOString()
                    };
                    
                    // Store in localStorage for demo purposes
                    localStorage.setItem('pi_auth_data', JSON.stringify(authData));
                    this.log('Authentication data stored:', authData);
                    
                    // Simulate backend authentication (replace with your actual backend call)
                    await this.simulateBackendAuth(authData);
                    
                    // Redirect to dashboard
                    this.redirectToDashboard();
                    
                } catch (error) {
                    this.log('Authentication failed:', error.message);
                    
                    let errorMessage = 'Authentication failed. Please try again.';
                    
                    // Handle specific error types
                    if (error.message.includes('User cancelled') || error.message.includes('cancelled')) {
                        errorMessage = 'Authentication was cancelled by user.';
                    } else if (error.message.includes('Network')) {
                        errorMessage = 'Network error. Please check your connection.';
                    } else if (error.message.includes('Invalid authentication')) {
                        errorMessage = 'Invalid authentication result. Please try again.';
                    }
                    
                    this.showStatus(errorMessage, 'error');
                    
                } finally {
                    this.isLoading = false;
                    this.setLoadingState(false);
                }
            }
            
            // Simulate backend authentication (replace with your actual implementation)
            async simulateBackendAuth(authData) {
                this.log('Simulating backend authentication...');
                
                // In a real application, you would send authData to your backend:
                
                const response = await fetch('/pi-auth/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken() // if using Django
                    },
                    body: JSON.stringify(authData),
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('Backend authentication failed');
                }
                
                const result = await response.json();
                this.log('Backend response:', result);
                
                
                // For demo purposes, just simulate a delay
                
            }
            
            // Display user information
            displayUserInfo(user, accessToken = null) {
                const details = [
                    { label: 'Username', value: user.username },
                    { label: 'User ID', value: user.uid },
                    { label: 'Access Token', value: accessToken ? `${accessToken.substring(0, 20)}...` : 'Not available' },
                    { label: 'Authenticated', value: new Date().toLocaleString() }
                ];
                
                this.userDetails.innerHTML = details.map(detail => 
                    `<div class="user-detail">
                        <strong>${detail.label}:</strong>
                        <span>${detail.value}</span>
                    </div>`
                ).join('');
                
                this.userInfo.style.display = 'block';
            }
            
            // Redirect to dashboard with countdown
            redirectToDashboard() {
                this.redirectInfo.style.display = 'block';
                let seconds = 3;
                
                const countdownInterval = setInterval(() => {
                    seconds--;
                    this.countdown.textContent = seconds;
                    
                    if (seconds <= 0) {
                        clearInterval(countdownInterval);
                        this.log('Redirecting to dashboard...');
                        
                        // In a real application, redirect to your dashboard
                        window.location.href = '/dashboard';
                        
                        // For demo purposes, just show a message
                        // this.showStatus('Redirect to /dashboard (demo mode)', 'info');
                    }
                }, 1000);
            }
            
            // Set loading state
            setLoadingState(loading) {
                this.loginBtn.disabled = loading;
                if (loading) {
                    this.loginBtn.classList.add('loading');
                } else {
                    this.loginBtn.classList.remove('loading');
                }
            }
            
            // Show status message
            showStatus(message, type = 'info') {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
                this.status.style.display = 'block';
                
                // Auto-hide after 5 seconds for non-error messages
                if (type !== 'error') {
                    setTimeout(() => {
                        this.status.style.display = 'none';
                    }, 5000);
                }
            }
            
            // Debug logging
            log(message, data = null) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                
                if (data) {
                    console.log(logEntry, data);
                    this.debugLog.push(`${logEntry} ${JSON.stringify(data, null, 2)}`);
                } else {
                    console.log(logEntry);
                    this.debugLog.push(logEntry);
                }
                
                // Update debug log display
                this.debugLogElement.innerHTML = this.debugLog
                    .slice(-10) // Show last 10 entries
                    .map(entry => `<div>${entry}</div>`)
                    .join('');
                
                // Auto-scroll to bottom
                this.debugLogElement.scrollTop = this.debugLogElement.scrollHeight;
            }
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new PiNetworkAuth();
        });
        
        // Utility function for CSRF token (if using Django)
        function getCsrfToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') {
                    return decodeURIComponent(value);
                }
            }
            return null;
        }
    </script>
</body>
</html>
