<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Pi - Chiwe</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root {
            --pi-primary: #ffc107;
            --pi-gold: #ffd700;
            --pi-gold-dark: #e0a800;
            --pi-glow: rgba(255, 193, 7, 0.4);
            --primary: #2eD573;
            --background: #0a0a10;
            --background-alt: #0d0d14;
            --surface: #14141c;
            --surface-hover: #1a1a24;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --border-radius: 0.75rem;
            --transition: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 193, 7, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(46, 213, 115, 0.05) 0%, transparent 50%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: var(--pi-primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: float-particle 15s infinite linear;
        }

        .particle:nth-child(even) {
            background-color: var(--primary);
        }

        @keyframes float-particle {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            background: rgba(20, 20, 28, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 193, 7, 0.1);
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--pi-primary) 0%, var(--pi-gold) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px var(--pi-glow);
            animation: pulse-glow 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 10px 30px var(--pi-glow);
            }
            50% {
                box-shadow: 0 10px 40px rgba(255, 193, 7, 0.6);
            }
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--pi-primary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .pi-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--pi-primary);
            margin-bottom: 30px;
        }

        .pi-button {
            background: linear-gradient(135deg, var(--pi-primary), var(--pi-gold));
            color: var(--background);
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px var(--pi-glow);
        }

        .pi-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(45deg);
            transition: all var(--transition) ease;
            opacity: 0;
        }

        .pi-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 193, 7, 0.5);
        }

        .pi-button:hover:not(:disabled)::before {
            animation: shine 1.5s;
        }

        .pi-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .pi-button:disabled {
            background: linear-gradient(135deg, #666, #888);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .pi-button.loading {
            color: transparent;
        }

        .pi-button.loading::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid var(--background);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pi-icon {
            width: 32px;
            height: 32px;
            background: var(--background);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--pi-primary);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .status {
            margin-top: 25px;
            padding: 16px 20px;
            border-radius: var(--border-radius);
            font-weight: 500;
            display: none;
            animation: slideIn 0.4s ease-out;
            font-size: 0.95rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.success {
            background: rgba(46, 213, 115, 0.15);
            color: var(--primary);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status.error {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.3);
        }

        .status.info {
            background: rgba(255, 193, 7, 0.15);
            color: var(--pi-primary);
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .user-info {
            margin-top: 30px;
            padding: 25px;
            background: rgba(46, 213, 115, 0.1);
            border-radius: var(--border-radius);
            border: 1px solid rgba(46, 213, 115, 0.2);
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        .user-info h3 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .user-info h3::before {
            content: '✓';
            width: 28px;
            height: 28px;
            background: var(--primary);
            color: var(--background);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
        }

        .user-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(46, 213, 115, 0.2);
            text-align: left;
        }

        .user-detail:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .user-detail strong {
            color: var(--text);
            font-weight: 600;
        }

        .user-detail span {
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .features {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .footer-text {
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .footer-text a {
            color: var(--pi-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                width: 95%;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 1.6rem;
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 0.9rem;
                margin-bottom: 30px;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 2.2rem;
                margin-bottom: 25px;
            }

            .pi-badge {
                font-size: 0.8rem;
                padding: 6px 12px;
                margin-bottom: 25px;
            }

            .pi-button {
                padding: 15px 25px;
                font-size: 1rem;
                gap: 10px;
            }

            .pi-icon {
                width: 28px;
                height: 28px;
                font-size: 1.1rem;
            }

            .features {
                gap: 15px;
                margin-top: 25px;
            }

            .feature {
                font-size: 0.8rem;
            }

            .feature-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .status {
                padding: 14px 16px;
                font-size: 0.9rem;
                margin-top: 20px;
            }

            .user-info {
                padding: 20px;
                margin-top: 25px;
            }

            .user-info h3 {
                font-size: 1.1rem;
                margin-bottom: 16px;
            }

            .user-detail {
                padding: 10px 0;
                margin-bottom: 10px;
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }

            .user-detail span {
                font-size: 0.85rem;
            }

            .footer-text {
                font-size: 0.8rem;
                margin-top: 25px;
                line-height: 1.5;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .logo {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }

            .pi-button {
                padding: 14px 20px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 768px) and (max-height: 500px) {
            body {
                padding: 20px 0;
            }

            .container {
                padding: 25px 20px;
                max-height: 90vh;
                overflow-y: auto;
            }

            .logo {
                width: 50px;
                height: 50px;
                font-size: 1.8rem;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 1.3rem;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }

            .pi-badge {
                margin-bottom: 20px;
            }

            .features {
                display: none;
            }

            .footer-text {
                margin-top: 20px;
            }
        }
    </style>

</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo">π</div>
        
        <div class="pi-badge">
            <span>🔒</span>
            <span>Secure Pi Network Authentication</span>
        </div>
        
        <h1>Welcome to Chiwe</h1>
        <p class="subtitle">The first multiplayer esport arena on Pi Network. Sign in securely with your Pi account to start competing.</p>
        
        <button id="piLoginBtn" class="pi-button">
            <div class="pi-icon">π</div>
            <span>Sign in with Pi Network</span>
        </button>
        
        <div id="status" class="status"></div>
        
        <div id="userInfo" class="user-info">
            <h3>Authentication Successful</h3>
            <div id="userDetails"></div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🛡️</div>
                <span>Secure</span>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <span>Fast</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🎮</div>
                <span>Easy</span>
            </div>
        </div>

        <div class="footer-text">
            By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </div>
    </div>

    <script>
        // Create background particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 15}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();

        // Pi Network Login Implementation
        class PiNetworkAuth {
            constructor() {
                this.isInitialized = false;
                this.isLoading = false;
                this.user = null;
                
                // DOM elements
                this.loginBtn = document.getElementById('piLoginBtn');
                this.status = document.getElementById('status');
                this.userInfo = document.getElementById('userInfo');
                this.userDetails = document.getElementById('userDetails');
                
                this.init();
            }
            
            // Initialize Pi SDK
            async init() {
                try {
                    console.log('Initializing Pi SDK...');
                    
                    // Initialize Pi SDK: detect Pi Browser or dev hosts and enable sandbox there
                    const hostname = window.location.hostname || '';
                    const ua = navigator.userAgent || '';
                    const isPiBrowser = /pibrowser/i.test(ua) || /pi browser/i.test(ua);
                    const isDevHost = hostname === 'localhost' || hostname === '127.0.0.1' || hostname.endsWith('.ngrok.io') || hostname.includes('sandbox.minepi.com');
                    const sandboxFlag = isPiBrowser || isDevHost;
                    
                    await Pi.init({
                        version: "2.0",
                        sandbox: sandboxFlag
                    });

                    this.isInitialized = true;
                    console.log(`Pi SDK initialized successfully (${sandboxFlag ? 'sandbox' : 'production'})`);
                    this.showStatus('Ready to sign in', 'info');
                    
                    // Check if user is already authenticated
                    try {
                        this.user = await Pi.User.get();
                        console.log('User already authenticated:', this.user);
                        this.displayUserInfo(this.user);
                    } catch (error) {
                        console.log('No existing authentication found');
                    }
                    
                } catch (error) {
                    console.error('Failed to initialize Pi SDK:', error);
                    this.showStatus('Failed to initialize Pi Network SDK', 'error');
                    this.loginBtn.disabled = true;
                }
                
                // Attach event listener
                this.loginBtn.addEventListener('click', () => this.authenticate());
            }
            
            // Handle incomplete payments (required by Pi Network)
            onIncompletePaymentFound(payment) {
                console.log('Incomplete payment found:', payment);
                return Pi.completePayment(payment.identifier);
            }
            
            // Main authentication method
            async authenticate() {
                if (this.isLoading) {
                    console.log('Authentication already in progress');
                    return;
                }
                
                if (!this.isInitialized) {
                    this.showStatus('Pi SDK not initialized', 'error');
                    return;
                }
                
                try {
                    this.isLoading = true;
                    this.setLoadingState(true);
                    console.log('Starting Pi Network authentication...');
                    
                    // Define required scopes
                    const scopes = ['username', 'payments'];
                    console.log('Requesting scopes:', scopes);
                    
                    // Authenticate with Pi Network
                    const authResult = await Pi.authenticate(scopes, this.onIncompletePaymentFound.bind(this));
                    
                    console.log('Authentication successful:', {
                        hasAccessToken: !!authResult?.accessToken,
                        hasUser: !!authResult?.user,
                        username: authResult?.user?.username,
                        uid: authResult?.user?.uid
                    });
                    
                    // Validate authentication result
                    if (!authResult || !authResult.accessToken || !authResult.user) {
                        throw new Error('Invalid authentication result from Pi Network');
                    }
                    
                    // Store user data
                    this.user = authResult.user;
                    
                    // Display success
                    this.showStatus(`Welcome ${authResult.user.username}! Signing you in...`, 'success');
                    this.displayUserInfo(authResult.user, authResult.accessToken);
                    
                    // Store authentication data
                    const authData = {
                        accessToken: authResult.accessToken,
                        user: {
                            uid: authResult.user.uid,
                            username: authResult.user.username
                        },
                        timestamp: new Date().toISOString()
                    };
                    
                    // Store in localStorage
                    localStorage.setItem('pi_auth_data', JSON.stringify(authData));
                    console.log('Authentication data stored');
                    
                    // Send to backend
                    await this.sendToBackend(authData);
                    
                    // Redirect to dashboard immediately (no countdown)
                    this.redirectToDashboard();
                    
                } catch (error) {
                    console.error('Authentication failed:', error);
                    
                    let errorMessage = 'Authentication failed. Please try again.';
                    
                    // Handle specific error types
                    if (error.message.includes('User cancelled') || error.message.includes('cancelled')) {
                        errorMessage = 'Authentication was cancelled.';
                    } else if (error.message.includes('Network')) {
                        errorMessage = 'Network error. Please check your connection.';
                    } else if (error.message.includes('Invalid authentication')) {
                        errorMessage = 'Invalid authentication result. Please try again.';
                    }
                    
                    this.showStatus(errorMessage, 'error');
                    
                } finally {
                    this.isLoading = false;
                    this.setLoadingState(false);
                }
            }
            
            // Send authentication data to backend
            async sendToBackend(authData) {
                try {
                    console.log('Sending authentication to backend...');
                    
                    const response = await fetch('/pi-auth/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this.getCsrfToken()
                        },
                        body: JSON.stringify(authData),
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Backend authentication failed');
                    }
                    
                    const result = await response.json();
                    console.log('Backend authentication successful:', result);
                    
                } catch (error) {
                    console.error('Backend authentication error:', error);
                    // Don't throw error - allow redirect even if backend fails
                }
            }
            
            // Display user information
            displayUserInfo(user, accessToken = null) {
                const details = [
                    { label: 'Username', value: user.username },
                    { label: 'User ID', value: user.uid },
                    { label: 'Status', value: 'Authenticated ✓' }
                ];
                
                this.userDetails.innerHTML = details.map(detail => 
                    `<div class="user-detail">
                        <strong>${detail.label}</strong>
                        <span>${detail.value}</span>
                    </div>`
                ).join('');
                
                this.userInfo.style.display = 'block';
            }
            
            // Redirect to dashboard (no countdown)
            redirectToDashboard() {
                console.log('Redirecting to dashboard...');
                
                // Small delay for UX (show success message briefly)
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);
            }
            
            // Set loading state
            setLoadingState(loading) {
                this.loginBtn.disabled = loading;
                if (loading) {
                    this.loginBtn.classList.add('loading');
                } else {
                    this.loginBtn.classList.remove('loading');
                }
            }
            
            // Show status message
            showStatus(message, type = 'info') {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
                this.status.style.display = 'block';
                
                // Auto-hide after 5 seconds for non-error messages
                if (type !== 'error') {
                    setTimeout(() => {
                        this.status.style.display = 'none';
                    }, 5000);
                }
            }
            
            // Get CSRF token
            getCsrfToken() {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const [name, value] = cookie.trim().split('=');
                    if (name === 'csrftoken') {
                        return decodeURIComponent(value);
                    }
                }
                return null;
            }
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new PiNetworkAuth();
        });
    </script>
</body>
</html>
