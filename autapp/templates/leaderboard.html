<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Pioneers - Chiwe Leaderboard</title>
    <style>
        :root {
            --primary: #2eD573;
            --primary-dark: #25a65b;
            --pi-color: #ffc107;
            --pi-color-dark: #e0a800;
            --pi-glow: rgba(255, 193, 7, 0.4);
            --background: #0a0a0a;
            --card-bg: #1a1a1a;
            --card-border: #2b2b36;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --gradient-gold: linear-gradient(135deg, #ffd700, #ffed4e);
            --gradient-silver: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            --gradient-bronze: linear-gradient(135deg, #cd7f32, #ff8c42);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 193, 7, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(46, 213, 115, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 193, 7, 0.02) 0%, transparent 70%);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-10px) rotate(1deg); }
            66% { transform: translateY(5px) rotate(-1deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 193, 7, 0.6); }
        }

        @keyframes slideInUp {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideInLeft {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes countUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--pi-color);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(odd) {
            background: var(--primary);
            animation-delay: -2s;
        }

        .particle:nth-child(3n) {
            animation-delay: -4s;
            animation-duration: 8s;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(43, 43, 54, 0.3);
            z-index: 1000;
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--background);
            animation: glow 3s infinite;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 2rem 2rem;
            position: relative;
            z-index: 10;
        }

        /* Hero section */
        .hero {
            text-align: center;
            margin-bottom: 4rem;
            animation: slideInUp 1s ease-out;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--pi-color), var(--primary), var(--pi-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(255, 193, 7, 0.3);
            position: relative;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 193, 7, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(255, 193, 7, 0.2);
            min-width: 150px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--pi-color);
            display: block;
            animation: countUp 1s ease-out 0.5s both;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Podium section */
        .podium-section {
            margin-bottom: 4rem;
            animation: slideInUp 1s ease-out 0.3s both;
        }

        .podium {
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 2rem;
            margin-bottom: 3rem;
            perspective: 1000px;
        }

        .podium-place {
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .podium-place:hover {
            transform: translateY(-10px);
        }

        .podium-place.first {
            order: 2;
            animation: slideInUp 1s ease-out 0.6s both;
        }

        .podium-place.second {
            order: 1;
            animation: slideInLeft 1s ease-out 0.8s both;
        }

        .podium-place.third {
            order: 3;
            animation: slideInRight 1s ease-out 0.8s both;
        }

        .podium-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--background);
            overflow: hidden;
        }

        .podium-place.first .podium-avatar {
            width: 120px;
            height: 120px;
            background: var(--gradient-gold);
            animation: glow 2s infinite;
        }

        .podium-place.second .podium-avatar {
            background: var(--gradient-silver);
        }

        .podium-place.third .podium-avatar {
            background: var(--gradient-bronze);
        }

        .podium-crown {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        .podium-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .podium-points {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .podium-place.first .podium-points {
            color: var(--gold);
        }

        .podium-place.second .podium-points {
            color: var(--silver);
        }

        .podium-place.third .podium-points {
            color: var(--bronze);
        }

        .pi-icon {
            width: 24px;
            height: 24px;
            background: var(--pi-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--background);
            font-weight: bold;
        }

        .podium-rank {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--background);
        }

        .podium-place.first .podium-rank {
            background: var(--gold);
        }

        .podium-place.second .podium-rank {
            background: var(--silver);
        }

        .podium-place.third .podium-rank {
            background: var(--bronze);
        }

        /* Leaderboard list */
        .leaderboard-section {
            animation: slideInUp 1s ease-out 1s both;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--gradient-gold);
            border-radius: 2px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .leaderboard-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 0.5rem 0.6rem; /* much slimmer */
            display: flex;
            align-items: center;
            gap: 0.65rem; /* reduced gap */
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            min-height: 44px; /* enforce compact row height */
            line-height: 1;
            animation: slideInUp 0.5s ease-out both;
        }

        .leaderboard-item:nth-child(1) { animation-delay: 1.1s; }
        .leaderboard-item:nth-child(2) { animation-delay: 1.2s; }
        .leaderboard-item:nth-child(3) { animation-delay: 1.3s; }
        .leaderboard-item:nth-child(4) { animation-delay: 1.4s; }
        .leaderboard-item:nth-child(5) { animation-delay: 1.5s; }
        .leaderboard-item:nth-child(6) { animation-delay: 1.6s; }
        .leaderboard-item:nth-child(7) { animation-delay: 1.7s; }

        .leaderboard-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 193, 7, 0.2);
            border-color: rgba(255, 193, 7, 0.3);
        }

        .leaderboard-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--pi-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .leaderboard-item:hover::before {
            opacity: 1;
        }

        .rank-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--pi-color);
            min-width: 36px;
            text-align: center;
        }

        .user-avatar {
            width: 40px; /* slimmer avatar */
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pi-color), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            color: var(--background);
            position: relative;
        }

        .user-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            margin: 0; /* remove bottom margin so height is smaller */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.9;
            margin-left: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-points {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--pi-color);
        }

        .points-change {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            background: rgba(46, 213, 115, 0.2);
            color: var(--primary);
        }

        /* Sparkle effects */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--pi-color);
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        .sparkle:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 80%; right: 20%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { top: 50%; left: 80%; animation-delay: 1s; }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 100px 1rem 2rem;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            /* Make the first two hero stats horizontal and smaller on mobile,
               hide the third ('Active Mining') to declutter. */
            .hero-stats {
                flex-direction: row;
                gap: 0.5rem;
                align-items: center;
                justify-content: center;
            }

            .hero-stats .stat-item {
                padding: 0.5rem 0.75rem;
                min-width: 110px;
                border-radius: 10px;
            }

            .hero-stats .stat-number {
                font-size: 1.1rem;
            }

            .hero-stats .stat-label {
                font-size: 0.75rem;
            }

            /* Hide the third statistic (Active Mining) on mobile */
            .hero-stats .stat-item:nth-child(3) {
                display: none;
            }


            /* Mobile podium as a three-column grid: left / center / right.
               This ensures 1st is centered and elevated while 2nd/3rd sit
               left and right without overlapping the center avatar. */
            .podium {
                display: grid;
                /* give center column more min width so first place doesn't overlap
                   the side avatars on narrow screens */
                grid-template-columns: 1fr minmax(140px, 220px) 1fr;
                align-items: end;
                justify-items: center;
                gap: 1rem;
                height: auto;
                margin-bottom: 1rem;
            }

            .podium-place {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                transition: transform 0.25s ease;
                padding: 0 4px;
                justify-self: center;
            }

            .podium-place.first { grid-column: 2; transform: translateY(-26px); z-index: 10; }
            .podium-place.second { grid-column: 1; transform: translateY(0); z-index: 8; }
            .podium-place.third { grid-column: 3; transform: translateY(0); z-index: 8; }

            /* Avatar sizing on mobile */
            .podium-avatar { width: 84px; height: 84px; font-size: 1.9rem; }
            .podium-place.first .podium-avatar { width: 104px; height: 104px; }
            .podium-place.second .podium-avatar { width: 86px; height: 86px; }
            .podium-place.third .podium-avatar { width: 78px; height: 78px; }

            .podium-crown { top: -10px; font-size: 1.6rem; }
            .podium-rank { top: -8px; right: -8px; width: 26px; height: 26px; font-size: 0.85rem; }
            .podium-name { font-size: 1rem; margin-top: 0.5rem; }
            .podium-points { font-size: 1.05rem; margin-top: 0.25rem; }

            /* Keep standard leaderboard items vertical below the podium */
            .leaderboard-item { padding: 0.45rem 0.5rem; gap: 0.5rem; flex-direction: row; align-items: center; }
            .user-avatar { width: 40px; height: 40px; font-size: 1rem; }
            .rank-number { font-size: 1.0rem; min-width: 26px; }
            .user-info { width: auto; }
            .user-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
            .user-title { display: none; } /* hide subtitle on narrow screens to keep rows short */
            .user-points { align-self: center; margin-top: 0; }
            .points-change { font-size: 0.7rem; padding: 0.15rem 0.3rem; }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2rem;
            }

            .podium-avatar {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .podium-place.first .podium-avatar {
                width: 90px;
                height: 90px;
            }
        }

        /* Extra small phones: tighten podium spacing and sizes (grid-based) */
        @media (max-width: 420px) {
            .podium {
                grid-template-columns: 1fr minmax(120px, 180px) 1fr;
                gap: 0.6rem;
                margin-bottom: 0.8rem;
            }

            .podium-place.first { transform: translateY(-18px); }
            .podium-place.second, .podium-place.third { transform: translateY(0); }

            .podium-avatar { width: 72px; height: 72px; font-size: 1.6rem; }
            .podium-place.first .podium-avatar { width: 88px; height: 88px; }
            .podium-place.second .podium-avatar { width: 76px; height: 76px; }
            .podium-place.third .podium-avatar { width: 72px; height: 72px; }
        }
    </style>

</head>
<body>
    <!-- Django data passed to JavaScript via JSON script tag -->
    <script id="leaderboard-data" type="application/json">
    [
    {% for u in users %}
        {"username": "{{ u.username|escapejs }}", "points": {{ u.points|default:"0" }} }{% if not forloop.last %},{% endif %}
    {% empty %}
    {% endfor %}
    ]
    </script>

    <!-- Background particles -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">π</div>
                <div class="logo-text">Chiwe</div>
            </div>
        </div>
    </header>

    <!-- Main container -->
    <div class="container">
        <!-- Hero section -->
        <section class="hero">
            <h1 class="hero-title">
                Top Pioneers
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
            </h1>
            <p class="hero-subtitle">
                The Elite Pioneers of Chiwe! top 5 pioneers will be rewarded PI from the pool , earn chiwe points by playing games the more points the higher your rank 
            </p>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <span class="stat-number" id="user-count">0</span>
                    <div class="stat-label">Elite Pioneers</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="total-points">0</span>
                    <div class="stat-label">Total Pi Points</div>
                </div>
                <!-- Active Mining stat intentionally removed for mobile layout -->
            </div>
        </section>

        <!-- Podium section (Top 3) -->
        <section class="podium-section">
            <div class="podium">
                <!-- This will be populated by JavaScript with top 3 users -->
            </div>
        </section>

        <!-- Leaderboard section (Remaining users) -->
        <section class="leaderboard-section">
            <h2 class="section-title">Pioneer Rankings</h2>
            <div class="leaderboard-list" id="leaderboard-list">
                <!-- This will be populated by JavaScript with remaining users -->
            </div>
        </section>
    </div>

    <script>
        // Get leaderboard data from Django using json_script
        const leaderboardDataElement = document.getElementById('leaderboard-data');
        const leaderboardData = leaderboardDataElement ? JSON.parse(leaderboardDataElement.textContent) : [];

        class LeaderboardManager {
            constructor() {
                // Ensure points are numeric and sort by points descending so the top pioneers show first
                this.data = (leaderboardData || []).map(u => ({
                    username: u.username,
                    points: Number(u.points) || 0
                })).sort((a, b) => b.points - a.points);
                this.init();
            }

            init() {
                this.createParticles();
                this.renderPodium();
                this.renderLeaderboard();
                this.animateCounters();
                this.startParticleAnimation();
            }

            createParticles() {
                const particlesContainer = document.getElementById('particles');
                const particleCount = 50;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 6 + 's';
                    particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                    particlesContainer.appendChild(particle);
                }
            }

            renderPodium() {
                const podium = document.querySelector('.podium');
                const top3 = this.data.slice(0, 3);

                if (top3.length === 0) {
                    podium.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">No pioneers yet. Be the first!</p>';
                    return;
                }

                const podiumHTML = top3.map((user, index) => {
                    const position = index + 1;
                    const positionClass = position === 1 ? 'first' : position === 2 ? 'second' : 'third';
                    const crown = position === 1 ? '<div class="podium-crown">👑</div>' : '';
                    const avatar = user.username ? user.username.charAt(0).toUpperCase() : '?';
                    const points = user.points || 0;

                    return `
                        <div class="podium-place ${positionClass}">
                            <div class="podium-avatar">
                                ${crown}
                                <div class="podium-rank">${position}</div>
                                ${avatar}
                            </div>
                            <div class="podium-name">${user.username || 'Unknown'}</div>
                            <div class="podium-points">
                                <div class="pi-icon">π</div>
                                <span class="points-counter" data-target="${points}">0</span>
                            </div>
                        </div>
                    `;
                }).join('');

                podium.innerHTML = podiumHTML;
            }

            renderLeaderboard() {
                const leaderboardList = document.getElementById('leaderboard-list');
                const remaining = this.data.slice(3);

                if (remaining.length === 0) {
                    leaderboardList.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">More pioneers coming soon!</p>';
                    return;
                }

                const leaderboardHTML = remaining.map((user, index) => {
                    const rank = index + 4;
                    const avatar = user.username ? user.username.charAt(0).toUpperCase() : '?';
                    const title = this.getUserTitle(rank);
                    const change = Math.floor(Math.random() * 200) + 50; // Random points change for visual effect
                    const points = user.points || 0;

                    return `
                        <div class="leaderboard-item">
                            <div class="rank-number">${rank}</div>
                            <div class="user-avatar">${avatar}</div>
                            <div class="user-info">
                                <div class="user-name">${user.username || 'Unknown'}</div>
                                <div class="user-title">${title}</div>
                            </div>
                            <div class="user-points">
                                <div class="pi-icon">π</div>
                                <span class="points-counter" data-target="${points}">0</span>
                                <div class="points-change">+${change}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                leaderboardList.innerHTML = leaderboardHTML;
            }

            getUserTitle(rank) {
                const titles = {
                    4: "Elite Pioneer",
                    5: "Master Miner",
                    6: "Pi Champion",
                    7: "Blockchain Hero",
                    8: "Crypto Warrior",
                    9: "Digital Pioneer",
                    10: "Pi Explorer"
                };
                return titles[rank] || "Pi Pioneer";
            }

            animateCounters() {
                const counters = document.querySelectorAll('.points-counter');
                const totalPointsElement = document.getElementById('total-points');
                const userCountElement = document.getElementById('user-count');
                
                // Calculate total points and user count
                const totalPoints = this.data.reduce((sum, user) => sum + (user.points || 0), 0);
                const userCount = this.data.length;

                // Animate counters
                this.animateCounter(totalPointsElement, totalPoints, 2000);
                this.animateCounter(userCountElement, userCount, 1000);

                // Animate individual counters
                counters.forEach((counter, index) => {
                    const target = parseInt(counter.dataset.target) || 0;
                    setTimeout(() => {
                        this.animateCounter(counter, target, 1500);
                    }, index * 200);
                });
            }

            animateCounter(element, target, duration) {
                let start = 0;
                const increment = target / (duration / 16);
                
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= target) {
                        element.textContent = target.toLocaleString();
                        clearInterval(timer);
                    } else {
                        element.textContent = Math.floor(start).toLocaleString();
                    }
                }, 16);
            }

            startParticleAnimation() {
                const particles = document.querySelectorAll('.particle');
                
                setInterval(() => {
                    particles.forEach(particle => {
                        if (Math.random() < 0.1) {
                            particle.style.background = Math.random() < 0.5 ? 'var(--pi-color)' : 'var(--primary)';
                        }
                    });
                }, 2000);
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LeaderboardManager();
        });

        // Add some interactive effects
        document.addEventListener('mousemove', (e) => {
            const particles = document.querySelectorAll('.particle');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            particles.forEach((particle, index) => {
                if (index % 5 === 0) { // Only affect every 5th particle for performance
                    const speed = 0.5;
                    const x = (mouseX - 0.5) * speed;
                    const y = (mouseY - 0.5) * speed;
                    particle.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
                }
            });
        });
    </script>
</body>
</html>
